name: Build and Deploy Showcase

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install icon_gen
        run: |
          set -euo pipefail
          RELEASE_JSON="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/siiway/icon_gen/releases/latest)"
          ASSET_URL="$(printf '%s' "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "icon_gen") | .browser_download_url')"
          if [ -n "$ASSET_URL" ] && [ "$ASSET_URL" != "null" ]; then
            curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/octet-stream" "$ASSET_URL" \
              -o /usr/local/bin/icon_gen
            chmod +x /usr/local/bin/icon_gen
            echo "icon_gen installed successfully"
            icon_gen --help
          fi

      - name: Build and generate static site
        run: bun run generate

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
